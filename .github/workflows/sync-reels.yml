name: Sync Instagram reels

on:
  schedule:
    # Every 6 hours. Cron is UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync-reels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/fetch-reels.mjs

      - name: Commit changes if any
        run: |
          git config user.name "medcon-reel-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/reels.json
          if git diff --cached --quiet; then
            echo "No new reels — nothing to commit."
          else
            git commit -m "chore: sync latest Instagram reels [skip ci]"
            git push
          fi
