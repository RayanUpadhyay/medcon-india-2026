<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>

    <!-- Static metadata. Title, description and Open Graph title/description
         are injected from .figma/make/site.json by the vite config. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0C1018" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDCON India 2026" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />

    <!-- Event structured data — helps Google show a rich event result
         (date, venue, description) in search rather than a plain link.
         Keep this in sync with src/content/site.ts if the date/venue/entry
         fee ever change. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "MEDCON India 2026",
        "description": "India's student-led medical conference — hands-on medical skills workshops, an expert panel on modern healthcare, and the Best Student Life Saver competition.",
        "startDate": "2026-09-19T07:15:00+05:30",
        "endDate": "2026-09-19T15:00:00+05:30",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "location": {
          "@type": "Place",
          "name": "The International School Bangalore (TISB)",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "NAFL Valley, Whitefield - Sarjapur Road, Near Dommasandra Circle",
            "addressLocality": "Bangalore",
            "postalCode": "562125",
            "addressRegion": "Karnataka",
            "addressCountry": "IN"
          }
        },
        "organizer": {
          "@type": "Organization",
          "name": "MEDCON India",
          "url": "https://www.instagram.com/medconindia"
        },
        "offers": {
          "@type": "Offer",
          "price": "250",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Resolve the colour theme before first paint so there is no flash and
         no layout shift. Dark is the default; a stored choice wins, otherwise
         the OS light preference is honoured. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("medcon-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
